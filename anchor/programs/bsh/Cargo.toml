[package]
name = "bsh"
version = "1.4.2"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bsh"

[features]
default = []
cpi = ["no-entrypoint"]
mainnet = ["beton-shared-types/mainnet"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "beton-shared-types/idl-build"]
test-mode = []
# Mollusk-based integration tests require a prebuilt SBF artifact and the
# Solana test toolchain; they are opt-in so a plain `cargo test -p bsh --lib`
# (pure-logic + introspection-guard tests) needs neither. Run with:
#   anchor build --features test-mode
#   cargo test -p bsh --features sbf-tests
sbf-tests = ["dep:mollusk-svm", "dep:solana-sdk"]


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["metadata"] }
beton-shared-types = { path = "../../crates/shared-types" }
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "2.2.1"
solana-system-interface = "1.0.0"
solana-security-txt = "1.1.2"
# Opt-in (see the `sbf-tests` feature); never built for a normal `cargo test`.
mollusk-svm = { version = "0.15.1", optional = true }
solana-sdk = { version = "5.0.0", optional = true }

[dev-dependencies]
# Used by the Audit H-1 introspection-guard regression tests to build a
# synthetic instructions sysvar; same version already in the dependency tree.
solana-instruction = "3.4.0"

