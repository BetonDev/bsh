[toolchain]
anchor_version = "1.0.2"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

# Audit H1: the mainnet deploy guard (scripts/guard-mainnet-deploy.mjs) requires
# an explicit [features.mainnet] selecting only the `mainnet` build feature so a
# mainnet artifact can never be produced with the wrong network identity.
[features.mainnet]
mainnet = ["mainnet"]

[programs.mainnet]
beton = "HSVohDX9Y2AHwsixSU6wMR29nwyYZgYKuKqrwaeQfLaz"
bsh = "91ahrFntCbnRAcJhsSQGd4j2QNdiUZTbESA6cJYKeovn"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "vitest"

[hooks]
